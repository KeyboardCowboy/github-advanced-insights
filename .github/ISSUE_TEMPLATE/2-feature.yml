name: Feature request
description: A new capability, with a user story and justification
labels: ["#Feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
      placeholder: "When I look at the Peer Review report I cannot tell who is..."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What happens today
      description: The current behaviour, and why it falls short.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Why it is worth doing
      description: >
        What decision does this let someone make, or what does it prevent going wrong?
        Every option is also a field the settings form has to render, validate, and
        explain, so this is the case for paying that cost.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, if that was a real option.
