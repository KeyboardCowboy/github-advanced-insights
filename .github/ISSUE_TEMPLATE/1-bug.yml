name: Bug
description: Something is not working as designed
labels: ["#Bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tool reads a live board, so its characteristic failure is output that
        looks completely normal but rests on a wrong premise. If that is what you are
        seeing, say so — it changes how the fix is approached.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The actual behaviour, with real numbers or output where you have them.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Refresh the qa-aging report
        2. Open http://localhost:8080
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - fetch (reading from GitHub)
        - normalize (deriving stats, bins, rows)
        - build (writing the HTML)
        - report page (chart, table, notes)
        - report form
        - settings (accounts and projects)
        - CLI
        - not sure
    validations:
      required: true

  - type: dropdown
    id: wrongness
    attributes:
      label: How does it fail?
      description: Silent wrongness is more urgent than a visible error.
      options:
        - It errors or crashes visibly
        - It produces output that looks fine but is wrong
        - It silently omits data
        - Something looks wrong visually
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
