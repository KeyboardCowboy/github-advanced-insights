name: Documentation
description: Notes, ADRs, and information about the project
labels: ["#Documentation"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options:
        - Something is missing
        - Something is wrong or out of date
        - Something is unclear
        - A decision worth recording (ADR)
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "README.md, docs/github-api-notes.md, a code comment, or new"
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Detail
      description: >
        For a correction, what it says now and what it should say. For a decision,
        what was chosen, what was rejected, and why — the reasoning is the part that
        stops it being relitigated.
    validations:
      required: true
